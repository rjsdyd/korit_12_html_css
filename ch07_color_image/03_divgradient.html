<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      width: 300px;
      height: 300px;
      border: 1px solid black;
      background: linear-gradient(red, blue);
      margin-bottom: 15px;
    }
    div.yellow {
      background: linear-gradient(45deg, yellow, green);
    }
    div.deeppink {
      width: 400px;
      height: 400px;
      background: linear-gradient(90deg, deeppink, indigo);
      /* border-radius: 50%; */
    }
    div.three {
      background: linear-gradient(red 33%, white 33%, white 67%, blue 67%);
    }
    div.transparent {
      background: linear-gradient(217deg, red, transparent 70%),
        linear-gradient(127deg, lime, transparent 70%),
        linear-gradient(336deg, blue, transparent, 70%);
    }
  </style>
</head>
<body>
  <h1>그라데이션</h1>
  <div class="red"></div>
  <div class="yellow"></div>
  <div class="deeppink"></div>
  <div class="three"></div>
  <div class="transparent"></div>
</body>
</html>
