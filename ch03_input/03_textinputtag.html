<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>text</title>
</head>
<body bgcolor="5f5f5f">
  <h1>textinputtag.html</h1>
  <h1>텍스 관련 input 타입</h1>
  <form action="#">
    <label for="txtIp">text</label><br>
    <input 
      id = "txtIp"
      type="text"
      placeholder="5자 이하"
      maxlength="5"
      >
      <br><br>
      <lable for="pwdIp">password</lable><br>
      <input 
        id = "pwdIp"
        type="text"
        placeholder="4자 이상"
        minlength="4"
        >
      <br><br>
      <lable for="srcIp">search</lable><br>
      <input 
        id = "srcIp"
        type="search">
      <br><br>    <!--type = "tel로 생성"-->
      <lable for="tel">tel</lable><br>
      <input
        id = "tel"
        type="text">
      <br><br>
      <button type = "submit">제출</button>
  </form>
</body>
</html>
