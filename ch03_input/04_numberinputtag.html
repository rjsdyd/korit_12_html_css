  <h1>숫자 관련</h1><!-- id = numIp / type = number / min = 0 / max = 10-->

    <label for="numIp">number</label><br>
    <input 
      id = "numIp"
      type="number"
      min="0"
      max="10"
      >
  <br><br>
  <!-- id = rgIp / type = range / min = 0 / max = 100 / step = 20-->

  <input 
    id="rgIp"
    type="range"
    min="0"
    max="100"
    step="20"
    >
    <br><br>
    <!-- id = dtIp / type = date / min = "2020-01-01" / max = "2030-12-31" /-->

      >

</form>
